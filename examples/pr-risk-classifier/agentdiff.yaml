apiVersion: agentdiff/v1
agents:
  - name: pr-risk-classifier
    path: agents/pr-risk-classifier
    provider: claude
    model: claude-sonnet-4-6
    prompt: prompt.md
    schemas:
      input: schemas/input.json
      output: schemas/output.json
    evals:
      - golden.jsonl
      - adversarial.jsonl
    thresholds:
      golden:
        minPassRate: 1.0
      adversarial:
        maxRegressionPct: 0.5
