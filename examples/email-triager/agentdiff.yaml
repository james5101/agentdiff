apiVersion: agentdiff/v1
agents:
  - name: email-triager
    path: agents/email-triager
    provider: claude
    model: claude-haiku-4-5-20251001
    prompt: prompt.md
    schemas:
      input: schemas/input.json
      output: schemas/output.json
    evals:
      - golden.jsonl
      - adversarial.jsonl
    thresholds:
      golden:
        minPassRate: 0.95
      adversarial:
        maxRegressionPct: 0.05
