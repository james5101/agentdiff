[project]
name = "agentdiff"
version = "0.0.0"
description = "GitHub bot that posts behavioral eval diffs on agent definition PRs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "James Noonan" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "structlog>=24.1",
    "anthropic>=0.34",
    "jsonschema>=4.22",
    "gitpython>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
agentdiff = "agentdiff.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "vcrpy>=6.0",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "types-jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
