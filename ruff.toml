target-version = "py312"
line-length = 100
src = ["src", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ASYNC", # async correctness
    "S",   # bandit (security)
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF",
]
ignore = [
    "S101", # allow `assert` in tests
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[format]
quote-style = "double"
