# Dogfood: agentdiff evaluating itself in CI.
#
# Two agents run on every PR. The .github/workflows/agentdiff.yml
# workflow runs `agentdiff diff` against this config, base vs. head.
#
# - intent-classifier: tiny fixture, exact-match grading,
#   ~$0.001/run. Catches obvious regressions.
# - email-triager: realistic 8-field structured output, judged
#   grading. ~$0.10/run (mostly Sonnet judge). Catches nuanced
#   regressions across multiple decision axes.
#
# Total budget per PR diff: ~$0.10.
apiVersion: agentdiff/v1
agents:
  - name: intent-classifier
    path: tests/fixtures/sample-repo/agents/intent-classifier
    provider: claude
    model: claude-haiku-4-5-20251001
    prompt: prompt.md
    schemas:
      input: schemas/input.json
      output: schemas/output.json
    evals:
      - golden.jsonl
    thresholds:
      golden:
        minPassRate: 1.0

  - name: email-triager
    path: examples/email-triager/agents/email-triager
    provider: claude
    model: claude-haiku-4-5-20251001
    prompt: prompt.md
    schemas:
      input: schemas/input.json
      output: schemas/output.json
    evals:
      - golden.jsonl
      - adversarial.jsonl
    thresholds:
      # 5/6 must pass — absorbs one judge-nondeterminism flake while
      # still catching real regressions (which show up as 2+ failed
      # cases). The strict 0.95 from examples/ is fine for users who
      # control their judge model temperature; in-CI we want signal,
      # not noise.
      golden:
        minPassRate: 0.83
      # 1/3 may regress — adversarial cases are ambiguous by design,
      # and Sonnet judging the same input twice can disagree on
      # borderline-defensible reasoning. Two regressions still trips.
      adversarial:
        maxRegressionPct: 0.34
